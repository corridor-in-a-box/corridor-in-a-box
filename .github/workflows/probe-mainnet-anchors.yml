# Read-only probe workflow for mainnet anchors (RFC 0004 §7 step 2).
#
# Probing mainnet anchors reads public endpoints and moves no money.
# This workflow probes the fleet against mainnet configuration and stores the
# results as a workflow artifact, without writing on chain until the mainnet
# registry contract is deployed.
name: probe-mainnet-anchors
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      domains:
        description: "Space-separated domains to probe (default: contracts/anchors.json)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Probe mainnet anchors (read-only)
        env:
          DOMAINS: ${{ inputs.domains }}
        run: |
          domains="$DOMAINS"
          if [ -z "$domains" ]; then
            pnpm sweep:anchors --out mainnet-sweep/
          else
            pnpm sweep:anchors --out mainnet-sweep/ $domains
          fi

      - name: Publish probe summary
        if: always()
        run: |
          if [ -f mainnet-sweep/sweep.md ]; then
            cat mainnet-sweep/sweep.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload mainnet sweep artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-anchor-probe-${{ github.run_id }}
          path: mainnet-sweep/
          retention-days: 30
          if-no-files-found: error
