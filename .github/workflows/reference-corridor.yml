# Runs a WHOLE corridor — quote → comply → open → settle → reconcile →
# completed — against the Anchor Platform reference stack we stand up
# ourselves, so "the corridor works end to end" is re-checked on a schedule
# rather than being a claim someone made once.
#
# Deliberately separate from nightly-live-anchor.yml: that job probes a real
# third-party anchor read-only, this one owns both ends and settles. It is slow
# (the stack takes minutes to come up), so it runs on its own schedule and by
# hand, never on push.
name: reference-corridor
on:
  workflow_dispatch:
  schedule:
    # Offset from nightly-live-anchor (04:17) so the two never contend.
    - cron: "43 5 * * *"

jobs:
  corridor:
    runs-on: ubuntu-latest
    # The stack is minutes to boot and the corridor waits on the observer's own
    # cadence, but a hung container must not burn an hour of runner time.
    timeout-minutes: 30
    # Read-only, deliberately. This job holds the signing keys and runs
    # `pnpm install`, so it must never also hold a token that can push. The run's
    # record is handed to `publish-history` below as an artifact, and that job,
    # with no secrets and no install, is the one allowed to write.
    permissions:
      contents: read
    # Job-level, deliberately. The `secrets` context is NOT available in a
    # step-level `if:` — using it there is not a no-op, it makes the whole
    # workflow file invalid, and GitHub then fails every run at 0s without ever
    # starting a step. Same fix as nightly-live-anchor.yml and attest-anchors.yml.
    env:
      SIGNER_SECRET: ${{ secrets.CORRIDOR_SIGNER_SECRET }}
      # The account the reference anchor receives on, and the one the signer is
      # topped up from. The image ships its own, but that account's seed is
      # public, so anyone can merge it out from under us (someone did on
      # 2026-11-16, and every settle failed op_no_destination). This one only
      # this repo holds.
      DISTRIBUTION_SECRET: ${{ secrets.REFERENCE_DISTRIBUTION_SECRET }}
      # The corridor this job runs. Asserted to be testnet below before
      # anything is signed.
      MANIFEST: corridors/reference.corridor.yaml
      # Never set. The runners' mainnet guard is the backstop; this is the
      # first line, and it is here so a future edit to this file has to
      # remove it deliberately rather than merely forget it.
      CORRIDOR_ALLOW_MAINNET: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The recorded duration is wall-clock from here, so it includes the stack
      # booting — the cost a trend should show, not just the payment itself.
      - name: Note when the run started
        run: echo "RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # --- guards, before anything is stood up or signed -------------------

      # Testnet only. Parsed with the repo's own manifest loader rather than
      # grepped, so a restructured YAML cannot slip a mainnet corridor past a
      # pattern match.
      - name: Refuse a non-testnet corridor
        run: pnpm exec tsx scripts/assert-testnet-corridor.ts "$MANIFEST"

      # Preflight checks: ensure runner commands exist before spinning up
      # containers or attempting testnet settlement.
      - name: Check the corridor runner's prerequisites
        run: |
          set -euo pipefail
          missing=""
          grep -q 'doctor)' scripts/reference-anchor.sh \
            || missing="$missing scripts/reference-anchor.sh#doctor(#40)"
          node -e 'process.exit(require("./package.json").scripts["verify:corridor"] ? 0 : 1)' \
            || missing="$missing pnpm-verify:corridor(#41)"
          # The fault scenario below is half of what this job now proves.
          test -x scripts/fault-scenario.sh \
            || missing="$missing scripts/fault-scenario.sh#faults(#678)"
          grep -q 'faults)' scripts/reference-anchor.sh \
            || missing="$missing scripts/reference-anchor.sh#faults(#678)"
          if [ -n "$missing" ]; then
            echo "::error::this job needs, and cannot find:$missing"
            exit 1
          fi

      - name: Fail early without a signing key
        if: ${{ env.SIGNER_SECRET == '' }}
        run: |
          echo "::error::CORRIDOR_SIGNER_SECRET is not set. A full corridor settles on" \
               "testnet and cannot run unsigned — set the repository secret to a funded" \
               "testnet seed."
          exit 1

      - name: Fail early without the anchor's receiving key
        if: ${{ env.DISTRIBUTION_SECRET == '' }}
        run: |
          echo "::error::REFERENCE_DISTRIBUTION_SECRET is not set. The reference anchor needs" \
               "a receiving account only this repo controls — set the repository secret to" \
               "a testnet seed; pnpm prepare:distribution creates the account."
          exit 1

      # --- the run ---------------------------------------------------------

      # Before `up`, so reference-anchor.sh can point the anchor's config at it.
      # Writes DISTRIBUTION_ACCOUNT to $GITHUB_ENV.
      - name: Prepare the anchor's receiving account
        run: pnpm prepare:distribution

      - name: Stand up the reference anchor
        run: scripts/reference-anchor.sh up
        env:
          # Podman ships on the ubuntu-latest image, and the script's container
          # wiring (network aliases the platform's test profile hardcodes) is
          # written against it. Porting those steps to Docker would fork that
          # wiring in two places and let CI and a contributor's laptop drift —
          # the thing this job exists to prevent.
          READY_TIMEOUT_SECS: "600"

      - name: Health gate
        run: scripts/reference-anchor.sh doctor

      # Every run settles 10 testnet USDC from the signer into the anchor's
      # receiving account, so the USDC goes round in a loop: this step pays it
      # back from that account (DISTRIBUTION_SECRET, job env) when the signer
      # runs low. FUND_AMOUNT is kept below FUND_MIN_BALANCE so the receiving
      # account always holds enough to pay it: by the time the signer drops
      # under 50, at least 30 has landed on the other side.
      - name: Top up the signer
        run: pnpm fund:testnet
        env:
          CORRIDOR_SIGNER_SECRET: ${{ env.SIGNER_SECRET }}
          FUND_AMOUNT: "30"
          FUND_MIN_BALANCE: "50"

      # payout-watch plays the anchor's payout operator: the reference server
      # only pays a SEP-31 transaction out when its test endpoint is called (see
      # reference-anchor.sh). Its log lands next to the platform logs.
      - name: Run the corridor to completed
        run: |
          set -euo pipefail
          mkdir -p anchor-logs
          scripts/reference-anchor.sh payout-watch > anchor-logs/payout-watch.log 2>&1 &
          watcher=$!
          trap 'kill "$watcher" 2>/dev/null || true' EXIT
          # Keep the output for the history record below, and keep the runner's
          # own exit status: a pipe into tee must not turn a failure into a pass.
          set +e
          pnpm verify:corridor 2>&1 | tee corridor-run.log
          status=${PIPESTATUS[0]}
          set -e
          echo "CORRIDOR_EXIT=$status" >> "$GITHUB_ENV"
          exit "$status"
        env:
          CORRIDOR_SIGNER_SECRET: ${{ env.SIGNER_SECRET }}

      # --- the published history (issue #680) ------------------------------

      # Hands this run's facts to `publish-history`. It runs even when the
      # corridor failed: a history of green runs only cannot show a success rate.
      # Only the lines the recorder reads (the trail and the settle tx) leave this
      # job, not the whole log, because GitHub masks secrets in step logs but not
      # inside artifacts.
      - name: Save the run's facts for the history
        if: ${{ always() }}
        run: |
          mkdir -p reference-run
          {
            echo "RUN_STARTED_AT=${RUN_STARTED_AT:-}"
            echo "RUN_FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "CORRIDOR_EXIT=${CORRIDOR_EXIT:-}"
            if [ "$JOB_STATUS" = "cancelled" ]; then echo "RUN_CANCELLED=true"; fi
          } > reference-run/facts.env
          if [ -f corridor-run.log ]; then
            grep -E '^trail:|stellar tx:|explorer:' corridor-run.log > reference-run/corridor-run.log || true
          fi
        env:
          # Not `cancelled()`: the status functions are only valid in `if:`, and
          # using one anywhere else makes the whole workflow file invalid.
          JOB_STATUS: ${{ job.status }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: reference-run-${{ github.run_id }}
          path: reference-run/
          retention-days: 7
          if-no-files-found: warn

      # The fault scenario (#678): the same whole corridor, but the anchor
      # refunds instead of completing, and EXPECT_STATE=refunded makes that the
      # assertion. Running it here, on the stack already standing, is what keeps
      # `scripts/reference-anchor.sh faults` a live control rather than a
      # documented one — a regression in the injection fails this nightly job.
      - name: Run the corridor under an injected refund
        run: |
          set -euo pipefail
          pnpm fund:testnet
          scripts/fault-scenario.sh refund refunded
        env:
          CORRIDOR_SIGNER_SECRET: ${{ env.SIGNER_SECRET }}
          FUND_AMOUNT: "30"
          FUND_MIN_BALANCE: "50"

      # --- evidence and cleanup -------------------------------------------

      - name: Collect platform logs
        if: ${{ failure() }}
        run: scripts/reference-anchor.sh logs-dump anchor-logs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: reference-anchor-logs-${{ github.run_id }}
          path: anchor-logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Tear down
        if: ${{ always() }}
        run: scripts/reference-anchor.sh down

  # Commits the corridor job's record to web/lib/generated/reference-runs.json
  # (issue #680). A job of its own so the token that can push never sits next to
  # the signing keys or a `pnpm install`: this job reads no secrets and installs
  # nothing — the recorder runs on Node's own TypeScript type stripping. It runs
  # whatever the corridor's result, because a failed or cancelled night counts.
  publish-history:
    needs: corridor
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Missing only when the corridor job died before it could save the facts.
      # The recorder then still writes the night down as a failure rather than
      # leaving a gap in the success rate.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: reference-run-${{ github.run_id }}
          path: reference-run/

      # A re-run of this workflow run replaces its record rather than adding a
      # second one. A pull request can land while the corridor settles, so on a
      # rejected push this starts again from the new tip and records again — the
      # record is keyed by run id, so that never duplicates it.
      - name: Record and publish the history
        env:
          RUN_LOG: reference-run/corridor-run.log
          RUN_CANCELLED: ${{ needs.corridor.result == 'cancelled' }}
        run: |
          set -euo pipefail
          # Known keys with non-empty values only; anything else in the file is ignored.
          if [ -f reference-run/facts.env ]; then
            while IFS='=' read -r key value; do
              case "$key" in
                RUN_STARTED_AT | RUN_FINISHED_AT | CORRIDOR_EXIT | RUN_CANCELLED)
                  if [ -n "$value" ]; then export "$key=$value"; fi
                  ;;
              esac
            done < reference-run/facts.env
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --depth=1 origin "$GITHUB_REF_NAME"
            git reset --hard FETCH_HEAD
            node --experimental-strip-types scripts/record-reference-run.ts
            git add web/lib/generated/reference-runs.json
            if git diff --cached --quiet; then
              echo "history already records run $GITHUB_RUN_ID"
              exit 0
            fi
            git commit -m "chore(reference-runs): record nightly run $GITHUB_RUN_ID"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::could not publish web/lib/generated/reference-runs.json"
          exit 1

  # The same stack and the same quote path as the job above, but deliberately
  # too late: the firm quote is requested with a short SEP-38 `expire_after`,
  # the run waits past it, and only then tries to pay. The run must end in a
  # refusal with nothing submitted — no comply, no open, no settle.
  #
  # A separate job, not a step in `corridor`, so the happy path's result stays
  # readable on its own: red here means one claim about expiry broke, not that
  # "the corridor" is broken. Nothing is paid, so this job needs no
  # distribution account, no funding step and no payout watcher; the signer only
  # signs a SEP-10 challenge and the script asserts its balance is unchanged.
  quote-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level for the same reason as `corridor` above: the `secrets` context
    # cannot be read in a step-level `if:` without invalidating the whole file.
    env:
      SIGNER_SECRET: ${{ secrets.CORRIDOR_SIGNER_SECRET }}
      MANIFEST: corridors/reference.corridor.yaml
      # Never set — same first line of defence as the job above.
      CORRIDOR_ALLOW_MAINNET: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Testnet only, parsed with the repo's own manifest loader.
      - name: Refuse a non-testnet corridor
        run: pnpm exec tsx scripts/assert-testnet-corridor.ts "$MANIFEST"

      - name: Fail early without a signing key
        if: ${{ env.SIGNER_SECRET == '' }}
        run: |
          echo "::error::CORRIDOR_SIGNER_SECRET is not set. The scenario authenticates" \
               "(SEP-10) and requests a firm SEP-38 quote, so it cannot run unsigned —" \
               "set the repository secret to a testnet seed."
          exit 1

      - name: Stand up the reference anchor
        run: scripts/reference-anchor.sh up
        env:
          READY_TIMEOUT_SECS: "600"

      - name: Health gate
        run: scripts/reference-anchor.sh doctor

      # Passes only when the expired quote is refused, the run ends `failed`,
      # the submitter is never called and the signer's balance is unchanged.
      # The script also writes quote id, expiry, refusal and balances to
      # $GITHUB_STEP_SUMMARY.
      - name: Expire a firm quote, then try to pay
        run: pnpm verify:quote-expiry
        env:
          CORRIDOR_SIGNER_SECRET: ${{ env.SIGNER_SECRET }}
          QUOTE_EXPIRE_SECONDS: "10"

      - name: Collect platform logs
        if: ${{ failure() }}
        run: scripts/reference-anchor.sh logs-dump anchor-logs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: reference-anchor-logs-quote-expiry-${{ github.run_id }}
          path: anchor-logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Tear down
        if: ${{ always() }}
        run: scripts/reference-anchor.sh down
