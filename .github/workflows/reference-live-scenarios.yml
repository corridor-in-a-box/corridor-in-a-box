# Runs the four live testnet failure scenarios against the Anchor Platform
# reference stack:
# - Scenario #676: Amounts outside anchor limits (verify-scenario-limits)
# - Scenario #673: Anchor asks for customer info (verify-scenario-needs-info)
# - Scenario #675: Anchor down during the flow (verify-scenario-anchor-down)
# - Scenario #674: Payout fails and anchor refunds (verify-scenario-refund)
#
# Deliberately separate from reference-corridor.yml to verify resilience and
# failure mode invariants in dedicated test runs with rich job summaries.
name: reference-live-scenarios
on:
  workflow_dispatch:
  schedule:
    # Offset from reference-corridor (05:43) so the two never contend.
    - cron: "15 6 * * *"

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SIGNER_SECRET: ${{ secrets.CORRIDOR_SIGNER_SECRET }}
      DISTRIBUTION_SECRET: ${{ secrets.REFERENCE_DISTRIBUTION_SECRET }}
      MANIFEST: corridors/reference.corridor.yaml
      CORRIDOR_ALLOW_MAINNET: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # --- guards, before anything is stood up or signed -------------------

      - name: Refuse a non-testnet corridor
        run: pnpm exec tsx scripts/assert-testnet-corridor.ts "$MANIFEST"

      - name: Check runner prerequisites
        run: |
          set -euo pipefail
          missing=""
          grep -q 'doctor)' scripts/reference-anchor.sh \
            || missing="$missing scripts/reference-anchor.sh#doctor"
          node -e 'process.exit(require("./package.json").scripts["verify:scenarios"] ? 0 : 1)' \
            || missing="$missing pnpm-verify:scenarios"
          if [ -n "$missing" ]; then
            echo "::error::this job needs, and cannot find:$missing"
            exit 1
          fi

      - name: Fail early without a signing key
        if: ${{ env.SIGNER_SECRET == '' }}
        run: |
          echo "::error::CORRIDOR_SIGNER_SECRET is not set. A full corridor settles on" \
               "testnet and cannot run unsigned — set the repository secret to a funded" \
               "testnet seed."
          exit 1

      - name: Fail early without the anchor's receiving key
        if: ${{ env.DISTRIBUTION_SECRET == '' }}
        run: |
          echo "::error::REFERENCE_DISTRIBUTION_SECRET is not set. The reference anchor needs" \
               "a receiving account only this repo controls — set the repository secret to" \
               "a testnet seed; pnpm prepare:distribution creates the account."
          exit 1

      # --- stand up anchor stack --------------------------------------------

      - name: Prepare the anchor's receiving account
        run: pnpm prepare:distribution

      - name: Stand up the reference anchor
        run: scripts/reference-anchor.sh up
        env:
          READY_TIMEOUT_SECS: "600"

      - name: Health gate
        run: scripts/reference-anchor.sh doctor

      - name: Top up the signer
        run: pnpm fund:testnet
        env:
          CORRIDOR_SIGNER_SECRET: ${{ env.SIGNER_SECRET }}
          FUND_AMOUNT: "30"
          FUND_MIN_BALANCE: "50"

      # --- scenarios execution ----------------------------------------------

      - name: Scenario #676: Amounts outside anchor limits
        run: pnpm verify:scenario-limits
        env:
          CORRIDOR_SIGNER_SECRET: ${{ env.SIGNER_SECRET }}

      - name: Scenario #673: Anchor asks for more customer information
        run: pnpm verify:scenario-needs-info
        env:
          CORRIDOR_SIGNER_SECRET: ${{ env.SIGNER_SECRET }}

      - name: Scenario #675: Anchor down during the flow
        run: pnpm verify:scenario-anchor-down
        env:
          CORRIDOR_SIGNER_SECRET: ${{ env.SIGNER_SECRET }}

      - name: Scenario #674: Payout fails and the anchor refunds
        run: pnpm verify:scenario-refund
        env:
          CORRIDOR_SIGNER_SECRET: ${{ env.SIGNER_SECRET }}

      # --- evidence and cleanup ---------------------------------------------

      - name: Collect platform logs
        if: ${{ failure() }}
        run: |
          mkdir -p anchor-logs
          scripts/reference-anchor.sh logs-dump anchor-logs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: live-scenarios-anchor-logs-${{ github.run_id }}
          path: anchor-logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Tear down
        if: ${{ always() }}
        run: scripts/reference-anchor.sh down
